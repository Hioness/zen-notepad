        :root {
            --bg-color: #F0EEE6;
            --text-color: #333333;
            --accent-color: #666666;
            --highlight-color: #9EB8C6;
            --border-color: rgba(0, 0, 0, 0.1);
            --toolbar-bg: rgba(255, 255, 255, 0.9);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --critical: #c53030;
            --critical-bg: rgba(197, 48, 48, 0.1);
            --radius: 8px;
            --radius-sm: 4px;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #999999;
            --highlight-color: #B8A88A;
            --border-color: rgba(255, 255, 255, 0.15);
            --toolbar-bg: rgba(40, 40, 40, 0.95);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --critical: #ff6b6b;
            --critical-bg: rgba(255, 107, 107, 0.15);
            --radius: 8px;
            --radius-sm: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        ::selection {
            background: var(--highlight-color);
            color: #1f1f1f;
        }

        ::-moz-selection {
            background: var(--highlight-color);
            color: #1f1f1f;
        }

        #ascii-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.08;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.2;
            white-space: pre;
            overflow: hidden;
            color: var(--text-color);
            contain: strict;
            transform: translateZ(0);
        }

        #theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            background: var(--toolbar-bg);
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s ease;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        #theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        #editor-container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
            padding: 80px 20px 120px;
            min-height: 100vh;
        }

        #editor {
            width: 100%;
            min-height: 60vh;
            outline: none;
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-color);
            background: transparent;
        }

        #editor.has-overflow {
            padding-bottom: 160px;
        }

        #editor-placeholder {
            position: absolute;
            top: 78px;
            left: 20px;
            color: var(--accent-color);
            opacity: 0.6;
            pointer-events: none;
            font-size: 18px;
            line-height: 1.8;
            margin: 0;
            padding: 0;
            display: none;
        }

        #editor-placeholder.visible {
            display: inline-block;
        }

        #storage-warning {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: var(--critical-bg);
            border: 1px solid var(--critical);
            color: var(--critical);
            border-radius: var(--radius);
            font-size: 13px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            backdrop-filter: blur(10px);
        }

        #storage-warning.visible {
            opacity: 1;
            visibility: visible;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .font-serif {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
        }

        .font-sans {
            font-family: 'Inter', sans-serif;
        }

        #editor h1 {
            font-size: 2em;
            font-weight: 400;
            margin: 0.5em 0;
            line-height: 1.3;
        }

        #editor h2 {
            font-size: 1.5em;
            font-weight: 400;
            margin: 0.5em 0;
            line-height: 1.4;
        }

        #editor h3 {
            font-size: 1.2em;
            font-weight: 500;
            margin: 0.5em 0;
            line-height: 1.5;
        }

        #editor p {
            margin: 0.8em 0;
        }

        #editor b, #editor strong {
            font-weight: 600;
        }

        #editor i, #editor em {
            font-style: italic;
        }

        #editor ul {
            margin: 0.8em 0;
            padding-left: 1.4em;
        }

        #editor li {
            margin: 0.35em 0;
        }

        #editor hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 1.6em 0;
        }

        .skip-link {
            position: absolute;
            left: -9999px;
            top: 12px;
            padding: 8px 14px;
            background: var(--text-color);
            color: var(--bg-color);
            border-radius: var(--radius);
            font-size: 13px;
            z-index: 500;
            text-decoration: none;
        }

        .skip-link:focus {
            left: 16px;
        }

        /* Wrapper is transparent on desktop — children keep their own fixed anchors.
           Below 600px it becomes the docked bottom bar (see media query). */
        #mobile-bar {
            display: block;
            height: 0;
            overflow: visible;
        }

        #toolbar {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 8px;
            padding: 12px;
            background: var(--toolbar-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: 0 4px 20px var(--shadow-color);
            opacity: 0.6;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        #toolbar:hover {
            opacity: 1;
        }

        .toolbar-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s ease;
            position: relative;
        }

        .toolbar-btn:hover {
            background: var(--border-color);
            transform: translateY(-2px);
        }

        .toolbar-btn.active {
            background: var(--text-color);
            color: var(--bg-color);
        }

        .toolbar-btn .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            padding: 6px 10px;
            background: var(--text-color);
            color: var(--bg-color);
            font-size: 12px;
            border-radius: var(--radius);
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            pointer-events: none;
        }

        .toolbar-btn:hover .tooltip,
        .toolbar-btn:focus-visible .tooltip {
            opacity: 1;
            visibility: visible;
        }

        .font-indicator {
            font-size: 12px;
            font-weight: 500;
        }

        #bottom-left {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            z-index: 100;
        }

        #word-counter {
            padding: 10px 16px;
            background: var(--toolbar-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 12px;
            color: var(--accent-color);
            font-family: 'JetBrains Mono', monospace;
            backdrop-filter: blur(10px);
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        #word-counter:hover {
            opacity: 1;
        }

        #paste-md-btn {
            padding: 10px 14px;
            background: var(--toolbar-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-color);
            font-size: 12px;
            backdrop-filter: blur(10px);
            opacity: 0.6;
            transition: opacity 0.3s ease;
            position: relative;
        }

        #paste-md-btn:hover {
            opacity: 1;
        }

        #paste-md-btn .tooltip {
            position: absolute;
            bottom: 100%;
            left: 0;
            transform: translateY(-8px);
            padding: 6px 10px;
            background: var(--text-color);
            color: var(--bg-color);
            font-size: 12px;
            border-radius: var(--radius);
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            pointer-events: none;
        }

        #paste-md-btn:hover .tooltip,
        #paste-md-btn:focus-visible .tooltip {
            opacity: 1;
            visibility: visible;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--toolbar-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 32px var(--shadow-color);
            backdrop-filter: blur(10px);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-weight: 500;
            font-size: 16px;
        }

        .modal-close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-color);
            padding: 0;
            line-height: 1;
        }

        .modal-close-btn:hover {
            opacity: 0.6;
        }

        #md-input {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }

        #md-input:focus {
            border-color: var(--accent-color);
        }

        .modal-note {
            margin-top: 12px;
            font-size: 13px;
            color: var(--accent-color);
            line-height: 1.4;
        }

        .modal-note strong, .modal-note em, .modal-note code {
            font-size: 12px;
            padding: 1px 4px;
            border-radius: var(--radius-sm);
            background: var(--border-color);
        }

        .modal-note code {
            font-family: 'JetBrains Mono', monospace;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .modal-btn.primary {
            background: var(--text-color);
            color: var(--bg-color);
        }

        .modal-btn.primary:hover {
            opacity: 0.85;
        }

        .modal-btn.secondary {
            background: transparent;
            color: var(--text-color);
        }

        .modal-btn.secondary:hover {
            background: var(--border-color);
        }

        /* ── Confirm Dialog ───────────────────────────────────────────── */
        .confirm-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .confirm-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .confirm-dialog {
            background: var(--toolbar-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            width: 90%;
            max-width: 380px;
        }

        .confirm-dialog p {
            font-size: 14px;
            color: var(--text-color);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .confirm-dialog p strong {
            font-weight: 600;
            color: var(--text-color);
        }

        .confirm-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .confirm-btn {
            padding: 8px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .confirm-btn.cancel {
            background: transparent;
            color: var(--text-color);
        }

        .confirm-btn.cancel:hover {
            background: var(--border-color);
        }

        .confirm-btn.danger {
            background: transparent;
            color: var(--critical);
            border-color: var(--critical);

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js" integrity="sha384-vdScihEZCfbPnBQf+lc7LgXUdJVYyhC3yWHUW5C5P5GpHRqVnaM6HJELJxT6IqwM" crossorigin="anonymous"></script>
    <script>
        const editor = document.getElementById('editor');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const fontBtn = document.getElementById('font-btn');
        const copyBtn = document.getElementById('copy-btn');
        const asciiBg = document.getElementById('ascii-background');
        const toolbarBtns = document.querySelectorAll('.toolbar-btn[data-command]');
        const listBtn = document.querySelector('.toolbar-btn[data-command="insertUnorderedList"]');
        const boldBtn = document.querySelector('.toolbar-btn[data-command="bold"]');
        const italicBtn = document.querySelector('.toolbar-btn[data-command="italic"]');
        const headingBtn = document.getElementById('heading-btn');
        const headingLabel = document.getElementById('heading-label');
        const headingTooltip = document.getElementById('heading-tooltip');
        const editorPlaceholder = document.getElementById('editor-placeholder');
        const sidebarToggle = document.getElementById('sidebar-toggle-chrome');
        const sidebarToggleHeader = document.getElementById('sidebar-toggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const sidebarNotes = document.getElementById('sidebar-notes');
        const newNoteBtn = document.getElementById('new-note-btn');

        const fonts = ['font-sans', 'font-serif', 'font-mono'];
        const fontNames = ['Sans', 'Serif', 'Mono'];

        let notes = [];
        let activeNoteId = null;

        let saveTimeout;
        let animationId = 0;
        let time = 0;
        let lastPersistedNotesJSON = '';
        let lastPersistedActiveId = '';
        let sidebarTitleTimeout = 0;
        let lastTitledId = null;
        let lastTitledContent = null;
        let lastWaveFrame = 0;
        let cachedWaveCols = 0;
        let cachedWaveRows = 0;
        let reducedMotion = false;

        const CHAR_WIDTH = 8.4;
        const CHAR_HEIGHT = 17;
        // 8.3fps: identical calm at 0.08 opacity, ~1/3 less CPU + GPU + battery.
        const WAVE_FPS_MS = 120;

        const chars = ['█', '▓', '▒', '░', '·'];

        const PURIFY_CONFIG = {
            ALLOWED_TAGS: ['p', 'br', 'div', 'h1', 'h2', 'h3', 'strong', 'b', 'em', 'i', 'ul', 'li', 'hr', 'blockquote', 'code', 'pre', 'a', 'span'],
            ALLOWED_ATTR: ['href', 'class', 'rel', 'target']
        };

        const confirmOverlay = document.getElementById('confirm-overlay');
        const confirmMessage = document.getElementById('confirm-message');
        const confirmCancel = document.getElementById('confirm-cancel');
        const confirmOk = document.getElementById('confirm-ok');

        const storageWarning = document.getElementById('storage-warning');
        const storageCopyAll = document.getElementById('storage-copy-all');
        const themeColorMeta = document.getElementById('theme-color-meta');
        const liveRegion = document.getElementById('aria-live');
        let resizeTimeout;
        let savedRange = null;
        let confirmPreviousFocus = null;

        function showStorageWarning() {
            storageWarning.classList.add('visible');
        }

        function hideStorageWarning() {
            storageWarning.classList.remove('visible');
        }

        function fallbackCopy(text, onSuccess, onError) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                const success = document.execCommand('copy');
                document.body.removeChild(textarea);
                if (success) onSuccess(); else onError();
            } catch (e) {
                document.body.removeChild(textarea);
                onError();
            }
        }

        function measureWaveGrid() {
            cachedWaveCols = Math.ceil(window.innerWidth / CHAR_WIDTH) + 2;
            cachedWaveRows = Math.ceil(window.innerHeight / CHAR_HEIGHT);
        }

        function startWave() {
            if (animationId || reducedMotion) return;
            measureWaveGrid();
            lastWaveFrame = 0;
            animationId = requestAnimationFrame(generateAsciiWave);
        }

        function stopWave() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = 0;
            }
        }

        function generateAsciiWave(timestamp) {
            animationId = 0;
            if (reducedMotion || document.visibilityState === 'hidden' || !document.hasFocus()) {
                return;
            }
            if (timestamp && timestamp - lastWaveFrame < WAVE_FPS_MS) {
                animationId = requestAnimationFrame(generateAsciiWave);
                return;
            }
            lastWaveFrame = timestamp || performance.now();
            const width = cachedWaveCols || (measureWaveGrid(), cachedWaveCols);
            const height = cachedWaveRows || cachedWaveRows;
            const rows = new Array(height);

            for (let y = 0; y < height; y++) {
                const row = new Array(width);
                for (let x = 0; x < width; x++) {
                    const wave1 = Math.sin((x * 0.1) + (time * 0.02));
                    const wave2 = Math.cos((y * 0.08) + (time * 0.015));
                    const wave3 = Math.sin(((x + y) * 0.05) + (time * 0.01));
                    const value = (wave1 + wave2 + wave3 + 3) / 6;
                    const charIndex = Math.floor(value * (chars.length - 1));
                    row[x] = chars[Math.min(Math.max(charIndex, 0), chars.length - 1)];
                }
                rows[y] = row.join('');
            }

            asciiBg.textContent = rows.join('\n') + '\n';
            time = (time + 1) % 10000;
            animationId = requestAnimationFrame(generateAsciiWave);
        }

        function createNoteObject(content = '', font = 'font-mono') {
            const now = new Date().toISOString();
            return {
                id: Date.now().toString(36) + Math.random().toString(36).substring(2, 8),
                content: content,
                font: font,
                createdAt: now,
                updatedAt: now
            };
        }

        function getNoteTitle(html) {
            const temp = document.createElement('div');
            const safe = DOMPurify.sanitize(html || '', PURIFY_CONFIG);
            temp.innerHTML = safe;

            const heading = temp.querySelector('h1, h2, h3');
            if (heading) {
                const text = heading.textContent.trim();
                if (text) return text.substring(0, 40) || 'Untitled note';
            }

            for (const child of temp.children) {
                if (child.matches('h1, h2, h3')) continue;
                const text = child.textContent.trim();
                if (text) return text.substring(0, 40);
            }

            const allText = temp.textContent.trim();
            if (allText) return allText.substring(0, 40);

            return 'Untitled note';
        }

        function loadNotes() {
            const stored = localStorage.getItem('zen-notes');
            if (stored) {
                try {
                    notes = JSON.parse(stored);
                    if (!Array.isArray(notes) || notes.length === 0) {
                        notes = [createNoteObject()];
                    }
                } catch (e) {
                    notes = [createNoteObject()];
                }
            } else {
                const legacyContent = localStorage.getItem('zen-content');
                if (legacyContent) {
                    notes = [createNoteObject(legacyContent)];
                } else {
                    notes = [createNoteObject()];
                }
            }

            // Migrate notes created before per-note fonts.
            for (const note of notes) {
                if (!note.font || !fonts.includes(note.font)) {
                    note.font = 'font-mono';
                }
            }

            const storedActiveId = localStorage.getItem('zen-active-note-id');
            if (storedActiveId && notes.some(n => n.id === storedActiveId)) {
                activeNoteId = storedActiveId;
            } else {
                activeNoteId = notes[0].id;
            }

            const activeNote = notes.find(n => n.id === activeNoteId);
            if (activeNote && activeNote.content) {
                const clean = DOMPurify.sanitize(activeNote.content, PURIFY_CONFIG);
                editor.innerHTML = clean;
            } else {
                editor.innerHTML = '';
            }

            editorPlaceholder.classList.toggle('visible', isEditorEmpty());
            updateWordCounter();
            updateToolbarActiveState();
            updateScrollPadding();
            renderSidebar();
        }

        function syncThemeColor(isDark) {
            if (themeColorMeta) {
                themeColorMeta.setAttribute('content', isDark ? '#1a1a1a' : '#F0EEE6');
            }
        }

        function announce(text) {
            if (liveRegion) {
                liveRegion.textContent = '';
                setTimeout(() => { liveRegion.textContent = text; }, 50);
            }
        }

        function loadSettings() {
            const savedTheme = localStorage.getItem('zen-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

            loadNotes();

            const activeNote = notes.find(n => n.id === activeNoteId);
            if (activeNote) {
                applyFontToEditor(activeNote.font);
            }

            let isDark = false;

        function htmlToMarkdown(element) {
            let markdown = '';
            
            function traverse(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    return node.textContent;
                }
                
                if (node.nodeType !== Node.ELEMENT_NODE) {
                    return '';
                }
                
                const tag = node.tagName.toLowerCase();
                let content = '';
                
                for (const child of node.childNodes) {
                    content += traverse(child);
                }
                
                switch (tag) {
                    case 'h1':
                        return '# ' + content.trim() + '\n\n';
                    case 'h2':
                        return '## ' + content.trim() + '\n\n';
                    case 'h3':
                        return '### ' + content.trim() + '\n\n';
                    case 'b':
                    case 'strong':
                        return '**' + content + '**';
                    case 'i':
                    case 'em':
                        return '*' + content + '*';
                    case 'p':
                        return content.trim() + '\n\n';
                    case 'br':
                        return '\n';
                    case 'div':
                        return content.replace(/\n+$/, '') + '\n';
                    case 'ul':
                        return content;
                    case 'li':
                        return '- ' + content.trim() + '\n';
                    case 'hr':
                        return '---\n\n';
                    case 'blockquote':
                        return '> ' + content.trim().replace(/\n/g, '\n> ') + '\n\n';
                    case 'code':
                        return '`' + content + '`';
                    case 'pre':
                        return '\`\`\`\n' + content.trim() + '\n\`\`\`\n\n';
                    case 'a':
                        const href = node.getAttribute('href') || '';
                        return '[' + content + '](' + href + ')';
                    default:
                        return content;
                }
            }
            
            for (const child of element.childNodes) {
                markdown += traverse(child);
            }
            
            return markdown.trim();
        }

        function markdownToHtml(markdown) {
            const lines = markdown.split('\n');
            let html = '';
            let inParagraph = false;
            let inList = false;
            let inBlockquote = false;
            let inCodeBlock = false;
            let codeBuffer = '';

            function convertInline(text) {
                text = text.replace(/`([^`]+)`/g, (m, p1) => '<code>' + escapeHtml(p1) + '</code>');
                text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, p1, p2) => {
                    const href = sanitizeHref(p2);
                    return '<a href="' + escapeHtml(href) + '" rel="noopener noreferrer" target="_blank">' + p1 + '</a>';
                });
                text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
                text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
                text = text.replace(/__(.+?)__/g, '<strong>$1</strong>');
                text = text.replace(/\b_(.+?)_\b/g, '<em>$1</em>');
                return text;
            }

            function closeParagraph() {
                if (inParagraph) {
                    html += '</p>';
                    inParagraph = false;
                }
            }

            function closeList() {
                if (inList) {
                    html += '</ul>';
                    inList = false;
                }
            }

            function closeBlockquote() {
                if (inBlockquote) {
                    html += '</blockquote>';
                    inBlockquote = false;
                }
            }

            function closeCodeBlock() {
                if (inCodeBlock) {
                    html += escapeHtml(codeBuffer.replace(/\n$/, '')) + '</code></pre>';
                    inCodeBlock = false;
                    codeBuffer = '';
                }
            }

            for (let i = 0; i < lines.length; i++) {
                const rawLine = lines[i];
                const line = rawLine.trim();

                if (inCodeBlock) {
                    if (line === '```') {
                        closeCodeBlock();
                    } else {
                        codeBuffer += rawLine + '\n';
                    }
                    continue;
                }

                if (line === '```') {
                    closeParagraph();
                    closeList();
                    closeBlockquote();
                    inCodeBlock = true;
                    codeBuffer = '';
                    html += '<pre><code>';
                    continue;
                }

                if (line === '') {
                    closeParagraph();
                    closeList();
                    closeBlockquote();
                    continue;
                }

                if (/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)) {
                    closeParagraph();
                    closeList();
                    closeBlockquote();
                    html += '<hr>';
                    continue;
                }

                if (line.startsWith('# ')) {
                    closeParagraph();
                    closeList();
                    closeBlockquote();
                    html += '<h1>' + convertInline(line.substring(2)) + '</h1>';
                } else if (line.startsWith('## ')) {
                    closeParagraph();
                    closeList();
                    closeBlockquote();
                    html += '<h2>' + convertInline(line.substring(3)) + '</h2>';
                } else if (line.startsWith('### ')) {
                    closeParagraph();
                    closeList();
                    closeBlockquote();
                    html += '<h3>' + convertInline(line.substring(4)) + '</h3>';
                } else if (line.startsWith('- ') || line.startsWith('* ')) {
                    closeParagraph();
                    closeBlockquote();
                    if (!inList) {
                        inList = true;
                        html += '<ul>';
                    }
                    html += '<li>' + convertInline(line.substring(2)) + '</li>';
                } else if (line.startsWith('> ')) {
                    closeParagraph();
                    closeList();
                    if (!inBlockquote) {
                        inBlockquote = true;
                        html += '<blockquote>';
                    }
                    html += '<p>' + convertInline(line.substring(2)) + '</p>';
                } else {
                    closeList();
                    closeBlockquote();
                    if (!inParagraph) {
                        html += '<p>';
                        inParagraph = true;
                    } else {
                        html += ' ';
                    }
                    html += convertInline(line);
                }
            }

            closeParagraph();
            closeList();
            closeBlockquote();
            closeCodeBlock();

            return html;
        }

        function insertMarkdown() {
            const md = mdInput.value;
            if (!md.trim()) {
                closeModal();
                return;
            }

            const html = markdownToHtml(md);
            const clean = DOMPurify.sanitize(html, PURIFY_CONFIG);

            editor.focus();

            let range = null;

            // Prefer saved range from before modal opened
            if (savedRange) {
                try {
                    if (editor.contains(savedRange.commonAncestorContainer)) {
                        range = savedRange;
                    }
                } catch (e) {
                    // savedRange may be disconnected
                }
                savedRange = null;
            }

            // Fall back to current selection
            if (!range) {
                const sel = window.getSelection();
                if (sel.rangeCount > 0) {
                    const selRange = sel.getRangeAt(0);
                    if (editor.contains(selRange.commonAncestorContainer)) {
                        range = selRange;
                    }
                }
            }

            if (range) {
                range.deleteContents();
                const frag = document.createRange().createContextualFragment(clean);
                range.insertNode(frag);
                range.collapse(false);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            } else {
                // No valid selection — append at end
                const frag = document.createRange().createContextualFragment(clean);
                editor.appendChild(frag);
            }

            editorPlaceholder.classList.toggle('visible', isEditorEmpty());
            updateScrollPadding();
            saveContent();
            closeModal();

        function getCurrentBlock() {
            const sel = window.getSelection();
            if (sel.rangeCount === 0) return null;
            let node = sel.getRangeAt(0).commonAncestorContainer;
            if (node.nodeType === Node.TEXT_NODE) {
                node = node.parentElement;
            }
            const block = node.closest('p, li, h1, h2, h3, div');
            if (block && block !== editor && editor.contains(block)) {
                return block;
            }
            return null;
        }

        function convertLineToList(block) {
            const sel = window.getSelection();
            const range = document.createRange();
            range.selectNodeContents(block);
            sel.removeAllRanges();
            sel.addRange(range);
            document.execCommand('delete', false, null);
            document.execCommand('insertUnorderedList', false, null);
        }

        function convertLineToHr(block) {
            const hr = document.createElement('hr');
            const p = document.createElement('p');
            p.appendChild(document.createElement('br'));
            const frag = document.createDocumentFragment();
            frag.appendChild(hr);
            frag.appendChild(p);
            block.parentNode.replaceChild(frag, block);

            const sel = window.getSelection();
            sel.removeAllRanges();
            const range = document.createRange();
            range.setStart(p, 0);
            range.collapse(true);
            sel.addRange(range);
        }

        function insertHorizontalRule() {
            editor.focus();
            const sel = window.getSelection();
            if (sel.rangeCount > 0 && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
                document.execCommand('insertHTML', false, '<hr><p><br></p>');
            } else {
                const frag = document.createRange().createContextualFragment('<hr><p><br></p>');
                editor.appendChild(frag);
            }
            editor.focus();
        }

        function updateToolbarActiveState() {
            const sel = window.getSelection();
            if (sel.rangeCount === 0 || !editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
                document.querySelectorAll('.toolbar-btn.active').forEach(btn => {
                    btn.classList.remove('active');
                    btn.setAttribute('aria-pressed', 'false');
                });
                headingLabel.textContent = 'H';
                headingTooltip.textContent = 'Heading: Off';
                headingBtn.setAttribute('aria-pressed', 'false');
                return;
            }
            let node = sel.getRangeAt(0).commonAncestorContainer;
            if (node.nodeType === Node.TEXT_NODE) {
                node = node.parentElement;
            }
            const isBold = document.queryCommandState('bold');
            const isItalic = document.queryCommandState('italic');
            boldBtn.classList.toggle('active', isBold);
            boldBtn.setAttribute('aria-pressed', String(isBold));
            italicBtn.classList.toggle('active', isItalic);
            italicBtn.setAttribute('aria-pressed', String(isItalic));
            const inH1 = node.closest('h1') !== null;
            const inH2 = node.closest('h2') !== null;
            const inH3 = node.closest('h3') !== null;
            if (inH1) {
                headingLabel.textContent = 'H1';
                headingTooltip.textContent = 'Heading 1 — click for H2';
                headingBtn.classList.add('active');
                headingBtn.setAttribute('aria-pressed', 'true');
            } else if (inH2) {
                headingLabel.textContent = 'H2';
                headingTooltip.textContent = 'Heading 2 — click for H3';
                headingBtn.classList.add('active');
                headingBtn.setAttribute('aria-pressed', 'true');
            } else if (inH3) {
                headingLabel.textContent = 'H3';
                headingTooltip.textContent = 'Heading 3 — click to clear';
                headingBtn.classList.add('active');
                headingBtn.setAttribute('aria-pressed', 'true');
            } else {
                headingLabel.textContent = 'H';
                headingTooltip.textContent = 'Heading: Off';
                headingBtn.classList.remove('active');
                headingBtn.setAttribute('aria-pressed', 'false');
            }
            const inList = node.closest('ul') !== null;
            listBtn.classList.toggle('active', inList);
            listBtn.setAttribute('aria-pressed', String(inList));
        }

        function updateWordCounter() {
            const text = editor.textContent || '';
            const wordCount = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('word-counter').textContent = wordCount + ' word' + (wordCount === 1 ? '' : 's');
        }

        function updateScrollPadding() {
            const hasOverflow = document.documentElement.scrollHeight > document.documentElement.clientHeight;
            editor.classList.toggle('has-overflow', hasOverflow);
        }

        let scrollPaddingRaf = 0;
        let selectionRaf = 0;

        function scheduleScrollPadding() {
            if (scrollPaddingRaf) return;
            scrollPaddingRaf = requestAnimationFrame(() => {
                scrollPaddingRaf = 0;
                updateScrollPadding();
            });
        }

        function isEditorEmpty() {
            const text = editor.textContent || '';
            if (text.trim().length > 0) return false;
            if (editor.querySelector('ul, ol, li, hr, h1, h2, h3, blockquote, pre, table, img')) return false;

            const html = editor.innerHTML.trim().toLowerCase();
            const emptyPatterns = ['', '<br>', '<br/>', '<br />', '<div><br></div>', '<div><br/></div>', '<p><br></p>', '<p><br/></p>'];
            return emptyPatterns.includes(html);
        }

        editor.addEventListener('input', () => {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveContent, 500);
            updateWordCounter();
            scheduleScrollPadding();
            editorPlaceholder.classList.toggle('visible', isEditorEmpty());
        });

        editor.addEventListener('paste', (e) => {
            e.preventDefault();
            const html = e.clipboardData.getData('text/html');
            const text = e.clipboardData.getData('text/plain');

            // Try HTML paste first if we get meaningful content
            if (html) {
                const clean = DOMPurify.sanitize(html, PURIFY_CONFIG);
                if (clean) {
                    document.execCommand('insertHTML', false, clean);
                    editorPlaceholder.classList.toggle('visible', isEditorEmpty());
                    return;
                }
                // If DOMPurify stripped everything, fall through to plain text
            }

            // Plain text paste with explicit newline handling
            if (text) {
                const lines = text.split('\n');
                document.execCommand('insertText', false, lines[0]);
                for (let i = 1; i < lines.length; i++) {
                    document.execCommand('insertHTML', false, '<br>');
                    document.execCommand('insertText', false, lines[i]);
                }
            }

            editorPlaceholder.classList.toggle('visible', isEditorEmpty());
        });

        toolbarBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const command = btn.dataset.command;
                const value = btn.dataset.value;
                execCommand(command, value);
            });
        });

        headingBtn.addEventListener('click', () => {
            editor.focus();
            const block = getCurrentBlock();
            if (!block) {
                execCommand('formatBlock', 'H1');
                return;
            }
            if (block.tagName === 'H1') {
                execCommand('formatBlock', 'H2');
            } else if (block.tagName === 'H2') {
                execCommand('formatBlock', 'H3');
            } else if (block.tagName === 'H3') {
                execCommand('formatBlock', 'P');
            } else {
                execCommand('formatBlock', 'H1');
            }
        });

        fontBtn.addEventListener('click', cycleFont);
        copyBtn.addEventListener('click', copyText);
        themeToggle.addEventListener('click', toggleTheme);

        sidebarToggle.addEventListener('click', toggleSidebar);
        sidebarToggleHeader.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', () => {
            if (isSidebarOverlayMode()) {
                closeSidebar();
            }
        });
        newNoteBtn.addEventListener('click', createNote);

        sidebarNotes.addEventListener('click', (e) => {
            const deleteBtn = e.target.closest('.sidebar-note-delete');
            if (deleteBtn) {
                const item = deleteBtn.closest('.sidebar-note-item');
                if (item) {
                    const id = item.getAttribute('data-note-id');
                    const note = notes.find(n => n.id === id);
                    const title = note ? escapeHtml(getNoteTitle(note.content)) : 'this note';
                    if (e.shiftKey) {
                        deleteNote(id);
                    } else {
                        showConfirmDialog('Delete <strong>' + title + '</strong>?', () => deleteNote(id));
                    }
                }
                return;
            }
            const titleBtn = e.target.closest('.sidebar-note-title-btn');
            if (titleBtn) {
                const item = titleBtn.closest('.sidebar-note-item');
                if (item) switchNote(item.getAttribute('data-note-id'));
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && confirmOverlay.classList.contains('active')) {
                hideConfirmDialog();
                return;
            }
            if (e.key === 'Escape' && sidebar.classList.contains('open') && isSidebarOverlayMode()) {
                closeSidebar();
            }
        });

        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                document.execCommand('insertText', false, '    ');
                return;
            }

            const mod = e.metaKey || e.ctrlKey;
            if (mod && e.shiftKey) {
                if (e.key === '8' || e.key === '*') {
                    e.preventDefault();
                    execCommand('insertUnorderedList');
                    return;
                }
                if (e.key === '-' || e.key === '_') {
                    e.preventDefault();
                    insertHorizontalRule();
                    saveContent();
                    updateWordCounter();
                    editorPlaceholder.classList.toggle('visible', isEditorEmpty());
                    updateToolbarActiveState();
                    return;
                }
            }

            if (e.key === ' ' || e.key === 'Spacebar') {
                const block = getCurrentBlock();
                if (block) {
                    const text = block.textContent;
                    if (/^[-*]$/.test(text)) {
                        e.preventDefault();
                        convertLineToList(block);
                        saveContent();
                        updateWordCounter();
                        editorPlaceholder.classList.toggle('visible', isEditorEmpty());
                        updateToolbarActiveState();
                        return;
                    }
                }
            }

            if (e.key === 'Enter') {
                const block = getCurrentBlock();
                if (block) {
                    const text = block.textContent.trim();
                    if (/^[-*_]{3,}$/.test(text)) {
                        e.preventDefault();
                        convertLineToHr(block);
                        saveContent();
                        updateWordCounter();
                        editorPlaceholder.classList.toggle('visible', isEditorEmpty());
                        updateToolbarActiveState();
                        return;
                    }
                }
            }
        });

        document.addEventListener('selectionchange', () => {
            if (selectionRaf) return;
            selectionRaf = requestAnimationFrame(() => {
                selectionRaf = 0;
                updateToolbarActiveState();
            });
        });

        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                stopWave();
                measureWaveGrid();
                startWave();
                scheduleScrollPadding();
            }, 150);
        });

        window.addEventListener('beforeunload', () => {
            clearTimeout(saveTimeout);
            saveContent();
        });

        const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        reducedMotion = motionQuery.matches;

        motionQuery.addEventListener('change', (e) => {
            reducedMotion = e.matches;
            if (reducedMotion) {
                stopWave();
                asciiBg.textContent = '';
            } else {
                startWave();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                clearTimeout(saveTimeout);
                saveContent();
                stopWave();
            } else if (!reducedMotion) {
                startWave();
            }
        });

        window.addEventListener('blur', stopWave);
        window.addEventListener('focus', () => {
            if (!reducedMotion && document.visibilityState !== 'hidden') startWave();
        });

        // Mobile bar: ride above the on-screen keyboard. visualViewport shrinks
        // when the keyboard opens; offset the bar by the difference. The >100px
        // threshold ignores pinch-zoom and browser chrome show/hide.
        const mobileBar = document.getElementById('mobile-bar');
        const slimQuery = window.matchMedia('(max-width: 600px)');

        function updateMobileBar() {
            if (!slimQuery.matches || !window.visualViewport) {
                mobileBar.style.bottom = '';
                mobileBar.classList.remove('kbd-open');
                return;
            }
            const inset = window.innerHeight - window.visualViewport.height;
            const kbdOpen = inset > 100;
            mobileBar.style.bottom = kbdOpen ? inset + 'px' : '';
            mobileBar.classList.toggle('kbd-open', kbdOpen);
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', updateMobileBar);
        }
        slimQuery.addEventListener('change', updateMobileBar);

        loadSettings();
        scheduleScrollPadding();
        if (!reducedMotion) {
            startWave();
        }

        if ('serviceWorker' in navigator && /^https?:$/.test(window.location.protocol)) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
